<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Catalog | MANUSDRIP Admin</title>
  <link rel="stylesheet" href="css/admin.css">
  <link rel="icon" type="image/png" href="../images/logo/logo.png">
</head>
<body>

  <div class="admin-wrapper">
    
    <!-- Sidebar -->
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="sidebar-header">
        <img src="../images/logo/logo-white.png" alt="ManusDrip Logo" class="sidebar-logo">
        <span class="sidebar-badge">ADMIN</span>
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html" class="admin-nav-link">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
          </svg>
          Dashboard
        </a>
        <a href="products.html" class="admin-nav-link active">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
          </svg>
          Products
        </a>
        <a href="inventory.html" class="admin-nav-link">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/>
          </svg>
          Inventory
        </a>
        <a href="categories.html" class="admin-nav-link">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/>
          </svg>
          Categories
        </a>
        <a href="settings.html" class="admin-nav-link">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
          Settings
        </a>
      </nav>

      <div class="sidebar-footer">
        <button class="sidebar-logout-btn" onclick="AuthService.logout()">
          <svg style="width: 18px; height: 18px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
          LOGOUT
        </button>
      </div>
    </aside>

    <div class="admin-backdrop-overlay" id="adminBackdrop"></div>

    <!-- Main Content Area -->
    <div class="admin-main">
      
      <!-- Topbar -->
      <header class="admin-topbar">
        <div class="topbar-left">
          <button class="sidebar-toggle-btn" id="adminSidebarToggle" aria-label="Toggle navigation">
            <svg style="width: 24px; height: 24px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
          </button>
          <h2 class="topbar-title">PRODUCT CATALOG</h2>
        </div>

        <div class="topbar-right">
          <a href="add-product.html" class="admin-btn admin-btn-primary">
            + ADD PRODUCT
          </a>
        </div>
      </header>

      <!-- Content -->
      <main class="admin-content">
        
        <!-- Controls: Search & Filters -->
        <div class="admin-card" style="margin-bottom: 1.5rem;">
          <div class="admin-card-body" style="padding: 1.25rem;">
            <div style="display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; justify-content: space-between;">
              
              <!-- Search Bar -->
              <div style="flex: 1; min-width: 260px; position: relative;">
                <input type="text" id="productSearchInput" class="form-input" placeholder="Search by name, ID (e.g. MD001), or category..." oninput="handleFilterSearch()">
              </div>

              <!-- Filter Selector -->
              <div style="display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap;">
                <select id="statusFilterSelect" class="form-select" style="width: auto; min-width: 150px;" onchange="handleFilterSearch()">
                  <option value="all">All Statuses</option>
                  <option value="active">Active Only</option>
                  <option value="draft">Draft Only</option>
                  <option value="sold_out">Sold Out Only</option>
                  <option value="low_stock">Low Stock (≤ 5)</option>
                  <option value="out_stock">Out of Stock</option>
                  <option value="new_arrival">New Arrivals</option>
                  <option value="bestseller">Bestsellers</option>
                </select>

                <select id="categoryFilterSelect" class="form-select" style="width: auto; min-width: 150px;" onchange="handleFilterSearch()">
                  <option value="all">All Categories</option>
                </select>
              </div>

            </div>
          </div>
        </div>

        <!-- Product Table -->
        <section class="admin-card">
          <div class="admin-card-header">
            <div style="display: flex; align-items: center; gap: 0.75rem;">
              <h3 class="admin-card-title">ALL PRODUCTS</h3>
              <span id="productCounterBadge" class="admin-badge badge-draft">0 ITEMS</span>
            </div>
          </div>

          <div class="admin-table-wrapper">
            <table class="admin-table mobile-card-table">
              <thead>
                <tr>
                  <th>PRODUCT</th>
                  <th>CATEGORY</th>
                  <th>PRICE</th>
                  <th>STOCK</th>
                  <th>STATUS</th>
                  <th>FLAGS</th>
                  <th style="text-align: right;">ACTIONS</th>
                </tr>
              </thead>
              <tbody id="productsTableBody">
                <!-- Dynamic Products -->
              </tbody>
            </table>

            <div id="productsEmptyNotice" style="display: none; text-align: center; padding: 4rem 1rem;">
              <p style="color: var(--admin-gray-500); margin-bottom: 1rem;">No products found matching your search or filters.</p>
              <button type="button" class="admin-btn admin-btn-secondary admin-btn-sm" onclick="resetFilters()">RESET FILTERS</button>
            </div>
          </div>
        </section>

      </main>

    </div>

  </div>

  <!-- Scripts -->
  <script src="js/authService.js"></script>
  <script src="js/api.js"></script>
  <script src="js/categoryService.js"></script>
  <script src="js/productService.js"></script>
  <script src="js/inventoryService.js"></script>
  <script src="js/admin.js"></script>
  <script>
    let allProducts = [];

    async function initProductList() {
      // 1. Populate category filter options
      const categories = await CategoryService.getCategories();
      const catSelect = document.getElementById('categoryFilterSelect');
      categories.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.name;
        opt.textContent = c.name;
        catSelect.appendChild(opt);
      });

      // 2. Load products
      allProducts = await ProductService.getProducts();
      renderFilteredProducts(allProducts);
    }

    function renderFilteredProducts(products) {
      const tbody = document.getElementById('productsTableBody');
      const emptyNotice = document.getElementById('productsEmptyNotice');
      const counterBadge = document.getElementById('productCounterBadge');

      counterBadge.textContent = `${products.length} ${products.length === 1 ? 'ITEM' : 'ITEMS'}`;

      if (products.length === 0) {
        tbody.innerHTML = '';
        emptyNotice.style.display = 'block';
        return;
      }

      emptyNotice.style.display = 'none';

      tbody.innerHTML = products.map(p => {
        const totalStock = ProductService.calculateTotalStock(p);
        const stockStatus = ProductService.getStockStatus(totalStock);
        const statusBadgeClass = `badge-${p.status}`;
        
        let stockBadgeClass = 'badge-in-stock';
        if (totalStock === 0) stockBadgeClass = 'badge-out-stock';
        else if (totalStock <= 5) stockBadgeClass = 'badge-low-stock';

        const flags = [];
        if (p.featured) flags.push('<span style="font-size: 0.65rem; background: var(--admin-black); color: white; padding: 2px 6px; border-radius: 2px; font-weight: 700;">FEATURED</span>');
        if (p.newArrival) flags.push('<span style="font-size: 0.65rem; background: var(--admin-red); color: white; padding: 2px 6px; border-radius: 2px; font-weight: 700;">NEW DROP</span>');
        if (p.bestseller) flags.push('<span style="font-size: 0.65rem; background: #D97706; color: white; padding: 2px 6px; border-radius: 2px; font-weight: 700;">BESTSELLER</span>');

        return `
          <tr>
            <td class="table-product-cell" data-label="Product">
              <img src="${p.images[0] || '../images/logo/logo.png'}" alt="${p.name}" class="table-thumb">
              <div>
                <div class="table-product-name">${p.name}</div>
                <div class="table-product-id">${p.id}</div>
              </div>
            </td>
            <td data-label="Category">${p.category}</td>
            <td data-label="Price">₹${p.price.toLocaleString()}</td>
            <td data-label="Stock">
              <div style="font-weight: 700;">${totalStock} units</div>
              <span class="admin-badge ${stockBadgeClass}" style="margin-top: 2px;">${stockStatus}</span>
            </td>
            <td data-label="Status">
              <span class="admin-badge ${statusBadgeClass}">${p.status.replace('_', ' ')}</span>
            </td>
            <td data-label="Flags">
              <div style="display: flex; gap: 4px; flex-wrap: wrap;">
                ${flags.length > 0 ? flags.join('') : '<span style="color: var(--admin-gray-500); font-size: 0.75rem;">None</span>'}
              </div>
            </td>
            <td data-label="Actions" style="text-align: right;">
              <div class="table-actions" style="justify-content: flex-end;">
                <a href="edit-product.html?id=${p.id}" class="admin-btn admin-btn-secondary admin-btn-sm" title="Edit Product">
                  EDIT
                </a>
                <button type="button" class="admin-btn admin-btn-secondary admin-btn-sm" onclick="handleDuplicateProduct('${p.id}')" title="Duplicate Product">
                  DUPLICATE
                </button>
                <button type="button" class="admin-btn admin-btn-danger admin-btn-sm" onclick="handleDeleteProduct('${p.id}', '${p.name.replace(/'/g, "\\'")}')" title="Delete Product">
                  DELETE
                </button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function handleFilterSearch() {
      const search = document.getElementById('productSearchInput').value.trim().toLowerCase();
      const statusFilter = document.getElementById('statusFilterSelect').value;
      const categoryFilter = document.getElementById('categoryFilterSelect').value;

      let filtered = allProducts.filter(p => {
        // Search
        if (search) {
          const matchName = p.name.toLowerCase().includes(search);
          const matchId = (p.id || '').toLowerCase().includes(search);
          const matchCat = (p.category || '').toLowerCase().includes(search);
          if (!matchName && !matchId && !matchCat) return false;
        }

        // Category
        if (categoryFilter !== 'all' && p.category !== categoryFilter) {
          return false;
        }

        // Status Filter
        const totalStock = ProductService.calculateTotalStock(p);
        if (statusFilter === 'active' && p.status !== 'active') return false;
        if (statusFilter === 'draft' && p.status !== 'draft') return false;
        if (statusFilter === 'sold_out' && p.status !== 'sold_out') return false;
        if (statusFilter === 'low_stock' && (totalStock > 5 || totalStock === 0)) return false;
        if (statusFilter === 'out_stock' && totalStock > 0) return false;
        if (statusFilter === 'new_arrival' && !p.newArrival) return false;
        if (statusFilter === 'bestseller' && !p.bestseller) return false;

        return true;
      });

      renderFilteredProducts(filtered);
    }

    function resetFilters() {
      document.getElementById('productSearchInput').value = '';
      document.getElementById('statusFilterSelect').value = 'all';
      document.getElementById('categoryFilterSelect').value = 'all';
      handleFilterSearch();
    }

    async function handleDuplicateProduct(id) {
      const cloned = await ProductService.duplicateProduct(id);
      if (cloned) {
        adminToast(`Duplicated as ${cloned.id}!`, 'success');
        allProducts = await ProductService.getProducts();
        handleFilterSearch();
      }
    }

    function handleDeleteProduct(id, name) {
      confirmDialog({
        title: 'DELETE PRODUCT?',
        message: `Are you sure you want to permanently delete "${name}" (${id})? This action cannot be undone.`,
        confirmText: 'DELETE PRODUCT',
        onConfirm: async () => {
          await ProductService.deleteProduct(id);
          adminToast(`Product ${id} deleted successfully.`, 'success');
          allProducts = await ProductService.getProducts();
          handleFilterSearch();
        }
      });
    }

    document.addEventListener('DOMContentLoaded', initProductList);
  </script>
</body>
</html>
