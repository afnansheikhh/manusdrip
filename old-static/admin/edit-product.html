<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Product | MANUSDRIP Admin</title>
  <link rel="stylesheet" href="css/admin.css">
  <link rel="icon" type="image/png" href="../images/logo/logo.png">
</head>
<body>

  <div class="admin-wrapper">
    
    <!-- Sidebar -->
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="sidebar-header">
        <img src="../images/logo/logo-white.png" alt="ManusDrip Logo" class="sidebar-logo">
        <span class="sidebar-badge">ADMIN</span>
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html" class="admin-nav-link">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
          </svg>
          Dashboard
        </a>
        <a href="products.html" class="admin-nav-link active">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
          </svg>
          Products
        </a>
        <a href="inventory.html" class="admin-nav-link">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/>
          </svg>
          Inventory
        </a>
        <a href="categories.html" class="admin-nav-link">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/>
          </svg>
          Categories
        </a>
        <a href="settings.html" class="admin-nav-link">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
          Settings
        </a>
      </nav>

      <div class="sidebar-footer">
        <button class="sidebar-logout-btn" onclick="AuthService.logout()">
          <svg style="width: 18px; height: 18px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
          LOGOUT
        </button>
      </div>
    </aside>

    <div class="admin-backdrop-overlay" id="adminBackdrop"></div>

    <!-- Main Content -->
    <div class="admin-main">
      
      <!-- Topbar -->
      <header class="admin-topbar">
        <div class="topbar-left">
          <button class="sidebar-toggle-btn" id="adminSidebarToggle" aria-label="Toggle navigation">
            <svg style="width: 24px; height: 24px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
          </button>
          <h2 class="topbar-title" id="pageHeading">EDIT PRODUCT</h2>
        </div>

        <div class="topbar-right">
          <a href="products.html" class="admin-btn admin-btn-secondary">
            CANCEL
          </a>
          <button type="button" class="admin-btn admin-btn-primary" onclick="document.getElementById('editProductForm').requestSubmit()">
            SAVE CHANGES
          </button>
        </div>
      </header>

      <main class="admin-content" style="max-width: 1100px;">
        
        <form id="editProductForm" onsubmit="handleUpdateProduct(event)">
          
          <!-- 1. Basic Information -->
          <div class="admin-card">
            <div class="admin-card-header">
              <h3 class="admin-card-title">1. BASIC INFORMATION</h3>
              <span id="productBadgeHeader" class="admin-badge badge-active">ACTIVE</span>
            </div>
            <div class="admin-card-body">
              <div class="form-grid">
                
                <div class="form-group form-grid-full">
                  <label for="pName" class="form-label">PRODUCT NAME *</label>
                  <input type="text" id="pName" class="form-input" required>
                </div>

                <div class="form-group">
                  <label for="pId" class="form-label">PRODUCT ID (READONLY)</label>
                  <input type="text" id="pId" class="form-input" readonly style="background-color: var(--admin-gray-100);">
                </div>

                <div class="form-group">
                  <label for="pCategory" class="form-label">CATEGORY *</label>
                  <select id="pCategory" class="form-select" required></select>
                </div>

                <div class="form-group">
                  <label for="pPrice" class="form-label">SELLING PRICE (₹) *</label>
                  <input type="number" id="pPrice" class="form-input" required min="1">
                </div>

                <div class="form-group">
                  <label for="pOriginalPrice" class="form-label">ORIGINAL / COMPARE PRICE (₹)</label>
                  <input type="number" id="pOriginalPrice" class="form-input" min="0">
                </div>

                <div class="form-group form-grid-full">
                  <label for="pDescription" class="form-label">PRODUCT DESCRIPTION *</label>
                  <textarea id="pDescription" class="form-textarea" rows="4" required></textarea>
                </div>

              </div>
            </div>
          </div>

          <!-- 2. Product Images -->
          <div class="admin-card">
            <div class="admin-card-header">
              <h3 class="admin-card-title">2. PRODUCT IMAGES</h3>
            </div>
            <div class="admin-card-body">
              
              <div class="upload-dropzone" onclick="document.getElementById('imageFileInput').click()">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                </svg>
                <div style="font-family: var(--font-heading); font-weight: 800; font-size: 1rem; margin-bottom: 0.25rem;">
                  UPLOAD NEW IMAGES
                </div>
                <p style="color: var(--admin-gray-500); font-size: 0.813rem;">Click or drag JPG, PNG, WEBP files from your computer</p>
                <input type="file" id="imageFileInput" multiple accept="image/*" style="display: none;" onchange="handleImageSelection(event)">
              </div>

              <!-- URL Direct Input Fallback -->
              <div style="margin-top: 1rem; display: flex; gap: 0.5rem;">
                <input type="url" id="imageDirectUrl" class="form-input" placeholder="Or paste an image URL directly...">
                <button type="button" class="admin-btn admin-btn-secondary" onclick="addImageUrlDirect()">+ ADD URL</button>
              </div>

              <!-- Preview Grid -->
              <div class="image-preview-grid" id="imagePreviewContainer"></div>

            </div>
          </div>

          <!-- 3. Sizes & Inventory Matrix -->
          <div class="admin-card">
            <div class="admin-card-header">
              <div style="display: flex; align-items: center; gap: 0.75rem;">
                <h3 class="admin-card-title">3. SIZES & INVENTORY</h3>
                <span id="liveTotalStockBadge" class="admin-badge badge-draft">TOTAL STOCK: 0</span>
              </div>
            </div>
            <div class="admin-card-body">
              
              <label class="form-label">AVAILABLE SIZES</label>
              <div class="size-selector-pills" id="sizeSelectorPills" style="margin-bottom: 1.5rem;">
                <button type="button" class="size-pill-btn" data-size="XS" onclick="toggleSize('XS', this)">XS</button>
                <button type="button" class="size-pill-btn" data-size="S" onclick="toggleSize('S', this)">S</button>
                <button type="button" class="size-pill-btn" data-size="M" onclick="toggleSize('M', this)">M</button>
                <button type="button" class="size-pill-btn" data-size="L" onclick="toggleSize('L', this)">L</button>
                <button type="button" class="size-pill-btn" data-size="XL" onclick="toggleSize('XL', this)">XL</button>
                <button type="button" class="size-pill-btn" data-size="XXL" onclick="toggleSize('XXL', this)">XXL</button>
              </div>

              <label class="form-label">SIZE-WISE STOCK QUANTITIES</label>
              <div id="sizeStockContainer"></div>

            </div>
          </div>

          <!-- 4. Product Status & Flags -->
          <div class="admin-card">
            <div class="admin-card-header">
              <h3 class="admin-card-title">4. PRODUCT STATUS & VISIBILITY</h3>
            </div>
            <div class="admin-card-body">
              <div class="form-grid">
                
                <div>
                  <label class="form-label">PRODUCT STATUS</label>
                  <div style="display: flex; flex-direction: column; gap: 0.75rem; margin-top: 0.5rem;">
                    <label class="form-checkbox-row">
                      <input type="radio" name="productStatus" value="active" id="statusActive">
                      <div>
                        <strong>ACTIVE</strong>
                        <p style="font-size: 0.75rem; color: var(--admin-gray-500);">Product appears in the customer store.</p>
                      </div>
                    </label>

                    <label class="form-checkbox-row">
                      <input type="radio" name="productStatus" value="draft" id="statusDraft">
                      <div>
                        <strong>DRAFT</strong>
                        <p style="font-size: 0.75rem; color: var(--admin-gray-500);">Saved internally, hidden from the public website.</p>
                      </div>
                    </label>

                    <label class="form-checkbox-row">
                      <input type="radio" name="productStatus" value="sold_out" id="statusSoldOut">
                      <div>
                        <strong>SOLD OUT</strong>
                        <p style="font-size: 0.75rem; color: var(--admin-gray-500);">Visible but marked out of stock.</p>
                      </div>
                    </label>
                  </div>
                </div>

                <div>
                  <label class="form-label">FLAGS & HIGHLIGHTS</label>
                  <div style="display: flex; flex-direction: column; gap: 0.75rem; margin-top: 0.5rem;">
                    <label class="form-checkbox-row">
                      <input type="checkbox" id="flagFeatured">
                      <div>
                        <strong>FEATURED PRODUCT</strong>
                        <p style="font-size: 0.75rem; color: var(--admin-gray-500);">Showcase in featured campaign sections.</p>
                      </div>
                    </label>

                    <label class="form-checkbox-row">
                      <input type="checkbox" id="flagNewArrival">
                      <div>
                        <strong>NEW ARRIVAL DROP</strong>
                        <p style="font-size: 0.75rem; color: var(--admin-gray-500);">Mark with "NEW DROP" badge.</p>
                      </div>
                    </label>

                    <label class="form-checkbox-row">
                      <input type="checkbox" id="flagBestseller">
                      <div>
                        <strong>BESTSELLER</strong>
                        <p style="font-size: 0.75rem; color: var(--admin-gray-500);">Display in the homepage Bestsellers carousel.</p>
                      </div>
                    </label>
                  </div>
                </div>

              </div>
            </div>
          </div>

          <!-- Bottom Action Buttons -->
          <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1rem; margin-bottom: 3rem;">
            <a href="products.html" class="admin-btn admin-btn-secondary">
              CANCEL
            </a>
            <button type="submit" class="admin-btn admin-btn-primary" style="padding-left: 2rem; padding-right: 2rem;">
              SAVE CHANGES
            </button>
          </div>

        </form>

      </main>

    </div>

  </div>

  <!-- Scripts -->
  <script src="js/authService.js"></script>
  <script src="js/api.js"></script>
  <script src="js/categoryService.js"></script>
  <script src="js/imageService.js"></script>
  <script src="js/productService.js"></script>
  <script src="js/inventoryService.js"></script>
  <script src="js/admin.js"></script>
  <script>
    let currentProduct = null;
    let uploadedImages = [];
    let selectedSizes = [];
    let sizeStockMap = {};

    async function initEditPage() {
      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get('id');

      if (!productId) {
        window.location.href = 'products.html';
        return;
      }

      currentProduct = await ProductService.getProduct(productId);

      if (!currentProduct) {
        adminToast('Product not found.', 'error');
        setTimeout(() => window.location.href = 'products.html', 1000);
        return;
      }

      // 1. Populate Category Dropdown
      const categories = await CategoryService.getCategories();
      const catSelect = document.getElementById('pCategory');
      catSelect.innerHTML = categories.map(c => `
        <option value="${c.name}" ${c.name === currentProduct.category ? 'selected' : ''}>${c.name}</option>
      `).join('');

      // 2. Pre-fill Form Fields
      document.getElementById('pageHeading').textContent = `EDIT ${currentProduct.id}: ${currentProduct.name}`;
      document.getElementById('pId').value = currentProduct.id;
      document.getElementById('pName').value = currentProduct.name;
      document.getElementById('pPrice').value = currentProduct.price;
      document.getElementById('pOriginalPrice').value = currentProduct.originalPrice || '';
      document.getElementById('pDescription').value = currentProduct.description || '';

      // Status Radio
      if (currentProduct.status === 'draft') document.getElementById('statusDraft').checked = true;
      else if (currentProduct.status === 'sold_out') document.getElementById('statusSoldOut').checked = true;
      else document.getElementById('statusActive').checked = true;

      // Flags
      document.getElementById('flagFeatured').checked = Boolean(currentProduct.featured);
      document.getElementById('flagNewArrival').checked = Boolean(currentProduct.newArrival);
      document.getElementById('flagBestseller').checked = Boolean(currentProduct.bestseller);

      // Header Badge
      const headerBadge = document.getElementById('productBadgeHeader');
      headerBadge.textContent = currentProduct.status.toUpperCase();
      headerBadge.className = `admin-badge badge-${currentProduct.status}`;

      // Images
      uploadedImages = [...(currentProduct.images || [])];
      renderImagePreviews();

      // Sizes & Stock
      selectedSizes = [...(currentProduct.sizes || ['M'])];
      sizeStockMap = { ...(currentProduct.stock || {}) };

      // Set Active State on Size Pills
      document.querySelectorAll('.size-pill-btn').forEach(btn => {
        const sz = btn.dataset.size;
        if (selectedSizes.includes(sz)) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      renderSizeStockInputs();
    }

    // Image Upload Handlers
    async function handleImageSelection(event) {
      const files = event.target.files;
      if (!files || files.length === 0) return;

      const base64List = await ImageService.processFiles(files);
      uploadedImages.push(...base64List);
      renderImagePreviews();
      event.target.value = '';
    }

    function addImageUrlDirect() {
      const urlInput = document.getElementById('imageDirectUrl');
      const val = (urlInput.value || '').trim();
      if (val) {
        uploadedImages.push(val);
        renderImagePreviews();
        urlInput.value = '';
      }
    }

    function removeImage(index) {
      uploadedImages.splice(index, 1);
      renderImagePreviews();
    }

    function renderImagePreviews() {
      const container = document.getElementById('imagePreviewContainer');
      container.innerHTML = uploadedImages.map((src, i) => {
        const cleanSrc = (window.ImageService && ImageService.normalizeImageSrc) 
          ? ImageService.normalizeImageSrc(src) 
          : (typeof src === 'string' && src !== '[object Object]' ? src : '../images/campaign/drip-motion-jorts.jpg');
        return `
          <div class="image-preview-item">
            <img src="${cleanSrc}" alt="Product preview ${i + 1}" onerror="this.src='../images/campaign/drip-motion-jorts.jpg'">
            <button type="button" class="preview-delete-btn" onclick="removeImage(${i})" title="Delete image">✕</button>
          </div>
        `;
      }).join('');
    }

    // Size & Stock Handlers
    function toggleSize(size, btn) {
      const idx = selectedSizes.indexOf(size);
      if (idx > -1) {
        selectedSizes.splice(idx, 1);
        delete sizeStockMap[size];
        btn.classList.remove('active');
      } else {
        selectedSizes.push(size);
        sizeStockMap[size] = sizeStockMap[size] || 10;
        btn.classList.add('active');
      }
      renderSizeStockInputs();
    }

    function updateStockValue(size, delta) {
      const current = sizeStockMap[size] || 0;
      sizeStockMap[size] = Math.max(0, current + delta);
      renderSizeStockInputs();
    }

    function setDirectStockValue(size, inputEl) {
      const val = Math.max(0, parseInt(inputEl.value, 10) || 0);
      sizeStockMap[size] = val;
      renderSizeStockInputs();
    }

    function renderSizeStockInputs() {
      const container = document.getElementById('sizeStockContainer');
      const badge = document.getElementById('liveTotalStockBadge');

      if (selectedSizes.length === 0) {
        container.innerHTML = `<p style="color: var(--admin-gray-500); font-size: 0.813rem;">Please select at least one size above to set stock.</p>`;
        badge.textContent = 'TOTAL STOCK: 0';
        badge.className = 'admin-badge badge-out-stock';
        return;
      }

      let total = 0;
      container.innerHTML = selectedSizes.map(size => {
        const qty = sizeStockMap[size] || 0;
        total += qty;
        return `
          <div class="inventory-stepper-row">
            <span style="font-family: var(--font-heading); font-weight: 800; font-size: 1rem;">SIZE ${size}</span>
            <div class="qty-stepper-admin">
              <button type="button" onclick="updateStockValue('${size}', -1)">-</button>
              <input type="number" value="${qty}" min="0" onchange="setDirectStockValue('${size}', this)">
              <button type="button" onclick="updateStockValue('${size}', 1)">+</button>
            </div>
          </div>
        `;
      }).join('');

      badge.textContent = `TOTAL STOCK: ${total} UNITS`;
      badge.className = total === 0 ? 'admin-badge badge-out-stock' : total <= 5 ? 'admin-badge badge-low-stock' : 'admin-badge badge-in-stock';
    }

    // Save Changes
    async function handleUpdateProduct(e) {
      e.preventDefault();

      if (selectedSizes.length === 0) {
        adminToast('Please select at least one size for the product.', 'error');
        return;
      }

      const pName = document.getElementById('pName').value.trim();
      const pCategory = document.getElementById('pCategory').value;
      const pPrice = parseFloat(document.getElementById('pPrice').value);
      const pOriginalPrice = parseFloat(document.getElementById('pOriginalPrice').value) || null;
      const pDescription = document.getElementById('pDescription').value.trim();
      const status = document.querySelector('input[name="productStatus"]:checked')?.value || 'active';
      const featured = document.getElementById('flagFeatured').checked;
      const newArrival = document.getElementById('flagNewArrival').checked;
      const bestseller = document.getElementById('flagBestseller').checked;

      const finalImages = uploadedImages.length > 0 ? uploadedImages : currentProduct.images;

      const updatedData = {
        ...currentProduct,
        name: pName,
        category: pCategory,
        price: pPrice,
        originalPrice: pOriginalPrice,
        description: pDescription,
        images: finalImages,
        sizes: selectedSizes,
        stock: sizeStockMap,
        status,
        featured,
        newArrival,
        bestseller
      };

      await ProductService.updateProduct(updatedData);
      adminToast('CHANGES SAVED SUCCESSFULLY', 'success');

      setTimeout(() => {
        window.location.href = 'products.html';
      }, 700);
    }

    document.addEventListener('DOMContentLoaded', initEditPage);
  </script>
</body>
</html>
