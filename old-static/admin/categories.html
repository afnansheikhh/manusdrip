<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category Management | MANUSDRIP Admin</title>
  <link rel="stylesheet" href="css/admin.css">
  <link rel="icon" type="image/png" href="../images/logo/logo.png">
</head>
<body>

  <div class="admin-wrapper">
    
    <!-- Sidebar -->
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="sidebar-header">
        <img src="../images/logo/logo-white.png" alt="ManusDrip Logo" class="sidebar-logo">
        <span class="sidebar-badge">ADMIN</span>
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html" class="admin-nav-link">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
          </svg>
          Dashboard
        </a>
        <a href="products.html" class="admin-nav-link">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
          </svg>
          Products
        </a>
        <a href="inventory.html" class="admin-nav-link">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/>
          </svg>
          Inventory
        </a>
        <a href="categories.html" class="admin-nav-link active">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/>
          </svg>
          Categories
        </a>
        <a href="settings.html" class="admin-nav-link">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
          Settings
        </a>
      </nav>

      <div class="sidebar-footer">
        <button class="sidebar-logout-btn" onclick="AuthService.logout()">
          <svg style="width: 18px; height: 18px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
          LOGOUT
        </button>
      </div>
    </aside>

    <div class="admin-backdrop-overlay" id="adminBackdrop"></div>

    <!-- Main Content -->
    <div class="admin-main">
      
      <!-- Topbar -->
      <header class="admin-topbar">
        <div class="topbar-left">
          <button class="sidebar-toggle-btn" id="adminSidebarToggle" aria-label="Toggle navigation">
            <svg style="width: 24px; height: 24px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
          </button>
          <h2 class="topbar-title">STORE CATEGORIES</h2>
        </div>
      </header>

      <main class="admin-content" style="max-width: 900px;">
        
        <!-- Add Category Form -->
        <div class="admin-card" style="margin-bottom: 2rem;">
          <div class="admin-card-header">
            <h3 class="admin-card-title">+ ADD NEW CATEGORY</h3>
          </div>
          <div class="admin-card-body">
            <form onsubmit="handleCreateCategory(event)" style="display: flex; gap: 1rem; flex-wrap: wrap;">
              <input type="text" id="newCategoryName" class="form-input" required placeholder="e.g. Denim, Beanies, Cargo Shorts" style="flex: 1; min-width: 240px;">
              <button type="submit" class="admin-btn admin-btn-primary">
                ADD CATEGORY
              </button>
            </form>
          </div>
        </div>

        <!-- Categories List Table -->
        <section class="admin-card">
          <div class="admin-card-header">
            <h3 class="admin-card-title">ALL ACTIVE & INACTIVE CATEGORIES</h3>
          </div>

          <div class="admin-table-wrapper">
            <table class="admin-table mobile-card-table">
              <thead>
                <tr>
                  <th>CATEGORY NAME</th>
                  <th>ID</th>
                  <th>PRODUCTS</th>
                  <th>STATUS</th>
                  <th style="text-align: right;">ACTIONS</th>
                </tr>
              </thead>
              <tbody id="categoryTableBody"></tbody>
            </table>
          </div>
        </section>

      </main>

    </div>

  </div>

  <!-- Scripts -->
  <script src="js/authService.js"></script>
  <script src="js/api.js"></script>
  <script src="js/categoryService.js"></script>
  <script src="js/productService.js"></script>
  <script src="js/admin.js"></script>
  <script>
    async function loadCategories() {
      const categories = await CategoryService.getCategories();
      const allProducts = await ProductService.getProducts();
      const tbody = document.getElementById('categoryTableBody');

      tbody.innerHTML = categories.map(c => {
        const count = allProducts.filter(p => p.category === c.name).length;
        return `
          <tr>
            <td data-label="Category Name">
              <strong>${c.name}</strong>
            </td>
            <td data-label="ID">
              <code style="font-size: 0.75rem; color: var(--admin-gray-500);">${c.id}</code>
            </td>
            <td data-label="Products">
              ${count} ${count === 1 ? 'product' : 'products'}
            </td>
            <td data-label="Status">
              <span class="admin-badge ${c.active ? 'badge-active' : 'badge-draft'}">
                ${c.active ? 'ACTIVE' : 'INACTIVE'}
              </span>
            </td>
            <td data-label="Actions" style="text-align: right;">
              <div class="table-actions" style="justify-content: flex-end;">
                <button type="button" class="admin-btn admin-btn-secondary admin-btn-sm" onclick="handleEditCategoryName('${c.id}', '${c.name.replace(/'/g, "\\'")}', ${c.active})">
                  RENAME
                </button>
                <button type="button" class="admin-btn admin-btn-secondary admin-btn-sm" onclick="handleToggleCategory('${c.id}', '${c.name.replace(/'/g, "\\'")}', ${!c.active})">
                  ${c.active ? 'DEACTIVATE' : 'ACTIVATE'}
                </button>
                <button type="button" class="admin-btn admin-btn-danger admin-btn-sm" onclick="handleDeleteCategory('${c.id}', '${c.name.replace(/'/g, "\\'")}')">
                  DELETE
                </button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    async function handleCreateCategory(e) {
      e.preventDefault();
      const input = document.getElementById('newCategoryName');
      const name = input.value.trim();
      if (name) {
        await CategoryService.addCategory(name);
        input.value = '';
        adminToast(`Category "${name}" created!`, 'success');
        loadCategories();
      }
    }

    async function handleEditCategoryName(id, currentName, currentActive) {
      const newName = prompt('Enter new name for this category:', currentName);
      if (newName && newName.trim() !== '' && newName.trim() !== currentName) {
        await CategoryService.updateCategory(id, newName.trim(), currentActive);
        adminToast('Category renamed successfully.', 'success');
        loadCategories();
      }
    }

    async function handleToggleCategory(id, name, nextActive) {
      await CategoryService.updateCategory(id, name, nextActive);
      adminToast(`Category "${name}" is now ${nextActive ? 'active' : 'inactive'}.`, 'info');
      loadCategories();
    }

    function handleDeleteCategory(id, name) {
      confirmDialog({
        title: 'DELETE CATEGORY?',
        message: `Are you sure you want to delete category "${name}"?`,
        confirmText: 'DELETE',
        onConfirm: async () => {
          await CategoryService.deleteCategory(id);
          adminToast(`Category "${name}" deleted.`, 'success');
          loadCategories();
        }
      });
    }

    document.addEventListener('DOMContentLoaded', loadCategories);
  </script>
</body>
</html>
