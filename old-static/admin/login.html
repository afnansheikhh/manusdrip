<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | ManusDrip Owner Panel</title>
  <link rel="stylesheet" href="css/admin.css">
  <link rel="icon" type="image/png" href="../images/logo/logo.png">
</head>
<body style="background-color: var(--admin-off-white); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem;">

  <div style="background-color: var(--admin-white); width: 100%; max-width: 400px; border-radius: var(--radius-sm); border: 1px solid var(--admin-gray-200); box-shadow: var(--shadow-dropdown); padding: 2.5rem 2rem;">
    
    <!-- Logo & Header -->
    <div style="text-align: center; margin-bottom: 2rem;">
      <img src="../images/logo/logo.png" alt="ManusDrip Logo" style="height: 38px; width: auto; margin: 0 auto 1.25rem;">
      <div style="display: inline-block; background-color: var(--admin-black); color: var(--admin-white); font-family: var(--font-heading); font-size: 0.688rem; font-weight: 800; letter-spacing: 0.12em; padding: 0.25rem 0.65rem; border-radius: var(--radius-sm); margin-bottom: 0.75rem;">
        PRIVATE MANAGEMENT PANEL
      </div>
      <h1 style="font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em;">MANUSDRIP ADMIN</h1>
    </div>

    <!-- Login Form -->
    <form id="adminLoginForm" onsubmit="handleLoginSubmit(event)">
      
      <div class="form-group">
        <label for="adminPassword" class="form-label">PASSWORD</label>
        <input type="password" id="adminPassword" class="form-input" required placeholder="Enter private admin password" autofocus autocomplete="current-password">
      </div>

      <button type="submit" class="admin-btn admin-btn-primary" style="width: 100%; padding: 0.85rem 1rem; margin-top: 0.75rem;" id="loginSubmitBtn">
        LOGIN
      </button>

      <div id="loginErrorNotice" style="display: none; margin-top: 1.25rem; padding: 0.75rem 1rem; background-color: var(--admin-red-light); color: var(--admin-red); border-radius: var(--radius-sm); font-size: 0.875rem; font-weight: 600; text-align: center;"></div>

    </form>

    <!-- Hospet Flagship Management -->
    <div style="margin-top: 2rem; padding-top: 1.25rem; border-top: 1px solid var(--admin-gray-200); text-align: center; font-size: 0.75rem; color: var(--admin-gray-500);">
      ManusDrip Clothing & Streetwear • Hospet
    </div>

  </div>

  <script src="js/api.js"></script>
  <script src="js/authService.js"></script>
  <script>
    // Auto redirect to Dashboard if already authenticated
    document.addEventListener('DOMContentLoaded', () => {
      if (AuthService.isAuthenticated()) {
        window.location.href = 'dashboard.html';
      }
    });

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const passwordInput = document.getElementById('adminPassword');
      const btn = document.getElementById('loginSubmitBtn');
      const errEl = document.getElementById('loginErrorNotice');

      const password = passwordInput.value;
      if (!password) return;

      btn.disabled = true;
      btn.textContent = 'VERIFYING...';
      errEl.style.display = 'none';

      try {
        const result = await AuthService.login(password);

        if (result.success) {
          window.location.href = 'dashboard.html';
        } else {
          errEl.textContent = result.message || 'Incorrect password.';
          errEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'LOGIN';
          passwordInput.value = '';
          passwordInput.focus();
        }
      } catch (err) {
        errEl.textContent = 'Authentication failed. Please try again.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'LOGIN';
      }
    }
  </script>
</body>
</html>
